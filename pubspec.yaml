name: my_tube_list
description: A Flutter app to search YouTube videos and manage a curated list.
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  youtube_api: ^1.0.0
  youtube_player_flutter: ^9.1.2
  provider: ^6.0.0
  hive: ^2.0.0
  hive_flutter: ^1.1.0
  flutter_dotenv: ^5.1.0
  uuid: ^3.0.6
  firebase_core: ^3.10.0
  cloud_firestore: ^5.6.1
  firebase_auth: ^5.4.1
  path_provider: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.14
  hive_generator: ^2.0.1
  flutter_launcher_icons: "^0.13.1"
  flutter_native_splash: ^2.4.6

# executar: flutter pub run flutter_launcher_icons:main
flutter_icons:
  android: true
  ios: false
  image_path: "assets/images/mytubelist_logo.png"

# executar: flutter pub run flutter_native_splash:create
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/mytubelist_logo.png
  android: true
  ios: false
  web: false

flutter:
  uses-material-design: true


  assets:
    - .env
    - assets/images/mytubelist_logo.svg
    - assets/images/mytubelist_logo.png
    - assets/images/mytubelist_logo_name.png
    - assets/gifs/playing.gif
    - assets/images/paused.png